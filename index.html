<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style></style>
    <title>Calco_App</title>
  </head>
  <body>
    <section id="calco">
      <input id="display"readonly />
      <div id="keys">
        <button class="operator">+</button>
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">-</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">*</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">/</button>
        <button>0</button>
        <button>.</button>
        <button>=</button>
        <button class="operator">C</button>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
